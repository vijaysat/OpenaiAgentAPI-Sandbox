[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-advisor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "oci==2.189.0",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4", "authlib>=1.3,<2", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "itsdangerous>=2.2,<3",
]

[tool.setuptools.packages.find]
include = ["portfolio_advisor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
