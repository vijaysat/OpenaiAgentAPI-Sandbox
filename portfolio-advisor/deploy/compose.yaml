name: portfolio-advisor
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: local-rehearsal-only
      POSTGRES_DB: portfolio
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["portfolio_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      retries: 10
volumes:
  portfolio_data:
